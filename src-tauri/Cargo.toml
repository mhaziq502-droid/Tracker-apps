[package]
name = "work-progress-tracker"
version = "1.0.0"
description = "A personal work progress tracker with daily journal and to-dos"
authors = ["you"]
edition = "2021"

[lib]
name = "work_progress_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
